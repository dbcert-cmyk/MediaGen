# Alert Settings
alerts:
  cpu_threshold: 80  # Alert if CPU > 80%
  memory_threshold: 85  # Alert if memory > 85%
  disk_threshold: 90  # Alert if disk > 90%
  email_enabled: false
  # email_to: "admin@example.com"
  # email_from: "network@example.com"

# Dashboard Settings
dashboard:
  refresh_interval: 5  # Seconds between updates
  history_retention: 7  # Days to keep historical data
  port: 5001
